name: Deploy to Workshop

on:
  workflow_dispatch:
    inputs:
      changelog:
        type: string
        required: false
        default: "Deployment via Github to latest changes"

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          path: project

      - name: Remove Non-content
        run: |
          rm -rfv $GITHUB_WORKSPACE/project/.git*
          rm -fv $GITHUB_WORKSPACE/project/README.md
          rm -fv $GITHUB_WORKSPACE/project/COPYING
          rm -fv $GITHUB_WORKSPACE/project/.glualint.json
          rm -fv $GITHUB_WORKSPACE/project/.gitignore
          rm -fv $GITHUB_WORKSPACE/project/icon.jpg
          rm -fv $GITHUB_WORKSPACE/project/addon.json
          rm -fv $GITHUB_WORKSPACE/project/CONTRIBUTING.md
          rm -rfv $GITHUB_WORKSPACE/project/lua

      - name: Upload to Workshop
        uses: CFC-Servers/gmod-upload@master
        with:
          id: 3832741045
          changelog: ${{ inputs.changelog }}
          type: ServerContent
          tag1: build
        env:
          STEAM_USERNAME: ${{ secrets.STEAM_USERNAME }}
          STEAM_PASSWORD: ${{ secrets.STEAM_PASSWORD }}
